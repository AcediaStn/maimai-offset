name: Update plays

# 幾時跑：只有你自己撳掣先跑，唔會定時跑。
# 撳法：repo 頂部「Actions」→ 左邊「Update plays」→ 右邊「Run workflow」→ 綠色掣
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 由 tomomai 抄成績
        env:
          TOMOMAI_USER: steven      # ← 改做你個 tomomai username
          TOMOMAI_REGION: intl      # ← intl 或者 asia
          TOMOMAI_LIMIT: '20'       # ← 要幾多場
        run: node tools/fetch-plays.mjs

      - name: 有變先 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f plays.json ] && [ -n "$(git status --porcelain -- plays.json)" ]; then
            git add plays.json
            git commit -m "chore: update plays.json"
            git push
            echo "✓ 已更新 plays.json"
          else
            echo "冇變，唔 commit"
          fi
